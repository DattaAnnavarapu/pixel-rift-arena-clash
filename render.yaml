services:
  - type: web
    name: pixel-rift
    runtime: node
    # Free instances sleep when idle; cold starts can delay the first connection.
    plan: free
    region: ohio
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
